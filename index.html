<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="card">
      <div class="logo">Go<span>Hire</span></div>
      <p>فرصتك للعمل بالخارج تبدأ من هنا نوفر لك فرص عمل مميزة في الخارج، مع دعمك في جميع خطوات التقديم والتوظيف وإجراءات السفر</p>
      <h1>تسجيل الدخول</h1>
      <form id="loginForm" autocomplete="off">
        <label for="profilePhoto">الصورة الشخصية</label>
        <input
          type="file"
          id="profilePhoto"
          name="profilePhoto"
          accept=".jpg,.jpeg,image/jpeg"
        >
        <label for="username">الاسم ثلاثي</label>
        <input id="username" type="text" placeholder="أحمد محمد أحمد">
        <label for="username">السن</label>
        <input id="username" type="text" placeholder="18">
        <label for="username">الدولة</label>
        <input id="username" type="text" placeholder="مصر">
        <label for="username">المحافظة</label>
        <input id="username" type="text" placeholder="القاهرة">
        <label for="username">العنوان التفصيلي</label>
        <input id="username" type="text" placeholder="القاهرة - شارع .... - عمارة رقم..">
        <label for="username">الوظيفة</label>
        <input id="username" type="text" placeholder="عامل">
        <label for="username">الجنسية</label>
        <input id="username" type="text" placeholder="مصري">
        <label for="password">الايميل</label>
        <input id="text" type="text" placeholder="test.user@example.com">
      </form>

      <div id="result" class="result" hidden></div>
    </section>

  </main>

  <script>
const form = document.querySelector("form");

form.querySelectorAll("input, select, textarea").forEach(field => {
  field.required = true;
});
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
function exportToExcel() {
    const data = [
        {
          الصورة : document.getElementById("الاسم").value,
          الاسم ثلاثي: document.getElementById("الاسم").value,
          السن: document.getElementById("السن").value,
          الدولة: document.getElementById("الدولة").value,
          المحافظة: document.getElementById("المحافظة").value
          العنوان بالتفصيل: document.getElementById("العنوان").value
          الوظيفة: document.getElementById("الوظيفة").value
          الجنسية: document.getElementById("الجنسية").value
          الايميل: document.getElementById("الايميل").value
        }
    ];

    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(workbook, worksheet, "البيانات");

    XLSX.writeFile(workbook, "");
}
</script>

<button onclick="exportToExcel()">تسجيل الدخول 

</button>
</body>
</html>
