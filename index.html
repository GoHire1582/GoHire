<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="card">
      <div class="logo">Go<span>Hire</span></div>
      <p>فرصتك للعمل بالخارج تبدأ من هنا نوفر لك فرص عمل مميزة في الخارج، مع دعمك في جميع خطوات التقديم والتوظيف وإجراءات السفر</p>
      <h1>تسجيل الدخول</h1>
      
      <!-- بداية النموذج -->
      <form id="loginForm" autocomplete="off">
        <label for="profilePhoto">الصورة الشخصية</label>
        <input type="file" id="profilePhoto" accept="image/*">

        <label for="fullName">الاسم ثلاثي</label>
        <input id="fullName" type="text" placeholder="أحمد محمد أحمد" required>

        <label for="age">السن</label>
        <input id="age" type="text" placeholder="18" required>

        <label for="country">الدولة</label>
        <input id="country" type="text" placeholder="مصر" required>

        <label for="gov">المحافظة</label>
        <input id="gov" type="text" placeholder="القاهرة" required>

        <label for="address">العنوان التفصيلي</label>
        <input id="address" type="text" placeholder="القاهرة - شارع .... - عمارة رقم.." required>

        <label for="job">الوظيفة</label>
        <input id="job" type="text" placeholder="عامل" required>

        <label for="nationality">الجنسية</label>
        <input id="nationality" type="text" placeholder="مصري" required>

        <label for="email">الايميل</label>
        <input id="email" type="email" placeholder="test.user@example.com" required>

        <!-- وضعنا الزر داخل النموذج ليعمل التسجيل بشكل صحيح -->
        <button type="submit" id="submitBtn" style="margin-top: 20px; width: 100%; padding: 12px; cursor: pointer;">تسجيل الدخول</button>
      </form>

      <div id="result" class="result" hidden></div>
    </section>
  </main>

  <script>
    // ضع رابط الـ Connection URL المأخوذ من SheetBest بين التنصيص
    const GOOGLE_SHEET_API_URL = "https://api.sheetbest.com/sheets/a08b3225-92a8-407f-8463-b6dfd60036fa";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الإرسال...";

      const formData = {
        "الاسم ثلاثي": document.getElementById("fullName").value,
        "السن": document.getElementById("age").value,
        "الدولة": document.getElementById("country").value,
        "المحافظة": document.getElementById("gov").value,
        "العنوان التفصيلي": document.getElementById("address").value,
        "الوظيفة": document.getElementById("job").value,
        "الجنسية": document.getElementById("nationality").value,
        "الايميل": document.getElementById("email").value
      };

      fetch(GOOGLE_SHEET_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify([formData])
      })
      .then(response => response.json())
      .then(data => {
        alert("تم إرسال البيانات وتسجيلها بنجاح!");
        document.getElementById("loginForm").reset();
      })
      .catch(error => {
        alert("حدث خطأ أثناء الإرسال، تأكد من رابط SheetBest والاتصال بالإنترنت.");
        console.error("Error:", error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "تسجيل الدخول";
      });
    });
  </script>

</body>
</html>
