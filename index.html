<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>GoHire</title>
</head>
<body>

  <main class="page">
    <section class="card">
      <div class="logo">Go<span>Hire</span></div>
      <p>فرصتك للعمل بالخارج تبدأ من هنا نوفر لك فرص عمل مميزة في الخارج، مع دعمك في جميع خطوات التقديم والتوظيف وإجراءات السفر</p>
      <h1>تسجيل الدخول</h1>
      
      <form id="loginForm" autocomplete="off">
        <label for="profilePhoto">الصورة الشخصية</label>
        <input type="file" id="profilePhoto" accept="image/*" required>

        <label for="fullName">الاسم ثلاثي</label>
        <input id="fullName" type="text" placeholder="أحمد محمد أحمد" required>

        <label for="age">السن</label>
        <input id="age" type="text" placeholder="18" required>

        <label for="country">الدولة</label>
        <input id="country" type="text" placeholder="مصر" required>

        <label for="gov">المحافظة</label>
        <input id="gov" type="text" placeholder="القاهرة" required>

        <label for="address">العنوان التفصيلي</label>
        <input id="address" type="text" placeholder="القاهرة - شارع .... - عمارة رقم.." required>

        <label for="job">الوظيفة</label>
        <input id="job" type="text" placeholder="عامل" required>

        <label for="nationality">الجنسية</label>
        <input id="nationality" type="text" placeholder="مصري" required>

        <label for="email">الايميل</label>
        <input id="email" type="email" placeholder="test.user@example.com" required>

        <button type="submit" id="submitBtn" style="margin-top: 20px; width: 100%; padding: 12px; cursor: pointer;">تسجيل الدخول</button>
      </form>
    </section>
  </main>

  <script>
    // ضع هنا رابط Web app الذي نسخته من Apps Script
    const SCRIPT_URL = "ضع_رابط_WEB_APP_هنا";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري رفع البيانات والصورة...";

      const fileInput = document.getElementById("profilePhoto");
      const file = fileInput.files[0];

      if (!file) {
        alert("يرجى اختيار صورة شخصية");
        submitBtn.disabled = false;
        submitBtn.innerText = "تسجيل الدخول";
        return;
      }

      const reader = new FileReader();
      reader.onload = function (event) {
        const base64Data = event.target.result.split(',')[1];

        const payload = {
          fullName: document.getElementById("fullName").value,
          age: document.getElementById("age").value,
          country: document.getElementById("country").value,
          gov: document.getElementById("gov").value,
          address: document.getElementById("address").value,
          job: document.getElementById("job").value,
          nationality: document.getElementById("nationality").value,
          email: document.getElementById("email").value,
          fileName: file.name,
          mimeType: file.type,
          fileData: base64Data
        };

        fetch("https://script.google.com/macros/s/AKfycbzHZKIn350bP72mM8MktILDOVWV8vAWUElkaoNzCUji1xc2HBAr-0CArfMrLuKb50eT1A/exec", {
  method: "POST",
  body: JSON.stringify(payload)
})
        .then(res => res.json())
        .then(data => {
          if (data.result === "success") {
            alert("تم إرسال البيانات ورفع الصورة بنجاح!");
            document.getElementById("loginForm").reset();
          } else {
            alert("حدث خطأ أثناء حفظ البيانات: " + data.error);
          }
        })
        .catch(err => {
          alert("حدث خطأ في الاتصال بالسيرفر.");
          console.error(err);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "تسجيل الدخول";
        });
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
