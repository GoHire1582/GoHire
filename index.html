<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>GoHire</title>
</head>
<body>

  <main class="page">
    <section class="card">
      <div class="logo-container" style="text-align: center; margin-bottom: 10px;">
        <!-- صورة الطائرة فوق كلمة GoHire -->
        <img src="https://img.icons8.com/fluency/96/airplane-take-off.png" alt="Airplane" style="width: 50px; height: 50px; display: block; margin: 0 auto 5px auto;">
        <div class="logo">Go<span>Hire</span></div>
      </div>
      <p>فرصتك للعمل بالخارج تبدأ من هنا نوفر لك فرص عمل مميزة في الخارج، مع دعمك في جميع خطوات التقديم والتوظيف وإجراءات السفر</p>
      <h1>تسجيل</h1>
      
      <form id="loginForm" autocomplete="off">
        <label for="profilePhoto">الصورة الشخصية</label>
        <input type="file" id="profilePhoto" accept="image/*" required>

        <label for="fullName">الاسم ثلاثي</label>
        <input id="fullName" type="text" placeholder="أحمد محمد أحمد" required>

        <label for="age">السن</label>
        <input id="age" type="text" placeholder="18" required>

        <div class="input-group">
          <label for="nationalId">الرقم القومي</label>
          <input type="text" id="nationalId" name="nationalId" maxlength="14" placeholder="اكتب 14 رقم" required>
        </div>

        <label for="country">الدولة</label>
        <input id="country" type="text" placeholder="مصر" required>

        <label for="gov">المحافظة</label>
        <input id="gov" type="text" placeholder="القاهرة" required>

        <label for="address">العنوان التفصيلي</label>
        <input id="address" type="text" placeholder="القاهرة - شارع .... - عمارة رقم.." required>

        <label for="job">الوظيفة</label>
        <input id="job" type="text" placeholder="عامل" required>

        <label for="nationality">الجنسية</label>
        <input id="nationality" type="text" placeholder="مصري" required>

        <label for="email">الايميل</label>
        <input id="email" type="email" placeholder="test.user@example.com" required>

        <button type="submit" id="submitBtn" style="margin-top: 20px; width: 100%; padding: 12px; background-color: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">تسجيل الدخول</button>
      </form>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu6PJD0FQ75E6obcQUOGoSVPgGRTR45ARTFfo7RPQIh7aZpt7g7pjDmuCg9zuL9XYohg/exec";

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // تغيير حالة الزر أثناء الإرسال
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري إرسال البيانات...";

      const fileInput = document.getElementById("profilePhoto");
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert("يرجى اختيار صورة شخصية أولاً");
        resetButton();
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function (event) {
        try {
          const base64Data = event.target.result.split(',')[1];

          const payload = {
            fullName: document.getElementById("fullName").value,
            nationalId: document.getElementById("nationalId").value,
            age: document.getElementById("age").value,
            country: document.getElementById("country").value,
            gov: document.getElementById("gov").value,
            address: document.getElementById("address").value,
            job: document.getElementById("job").value,
            nationality: document.getElementById("nationality").value,
            email: document.getElementById("email").value,
            fileName: file.name,
            mimeType: file.type,
            fileData: base64Data
          };

          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          })
          .then(() => {
            alert("تم التسجيل بنجاح وسيتم التواصل معكم قريباً!");
            form.reset();
          })
          .catch(err => {
            alert("حدث خطأ أثناء الإرسال: " + err.message);
            console.error(err);
          })
          .finally(() => {
            resetButton();
          });

        } catch (err) {
          alert("خطأ في قراءة البيانات: " + err.message);
          console.error(err);
          resetButton();
        }
      };

      reader.onerror = function (error) {
        alert("خطأ أثناء رفع الصورة");
        console.error(error);
        resetButton();
      };

      reader.readAsDataURL(file);
    });

    function resetButton() {
      submitBtn.disabled = false;
      submitBtn.innerText = "تسجيل الدخول";
    }
  </script>

</body>
</html>
